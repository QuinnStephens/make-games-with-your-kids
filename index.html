<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Family Games</title>
<style>
  /* The game menu. The list of games comes from games.json, so you never need to edit this file
     to add a game. */
  :root {
    --bg: #fff8ec;
    --ink: #221e3c;
    --muted: #6b6488;
    --card: #ffffff;
    --pick: #ff5a78;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 32px 16px 48px;
  }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: clamp(32px, 6vw, 60px); line-height: 1.05; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: clamp(16px, 2vw, 20px); margin-top: 8px; }
  .grid {
    display: grid; gap: 24px; margin-top: 32px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
  }
  .card {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 4px solid var(--ink); border-radius: 18px; overflow: hidden;
    transition: transform .15s ease, box-shadow .15s ease;
    box-shadow: 0 6px 0 var(--ink);
  }
  .card .art { aspect-ratio: 16 / 9; background: #eee center / cover no-repeat; border-bottom: 4px solid var(--ink); }
  .card .text { padding: 14px 18px 18px; }
  .card h2 { font-size: 24px; }
  .card p { color: var(--muted); margin-top: 6px; font-size: 17px; line-height: 1.35; }
  .card:hover, .card.sel { transform: translateY(-4px); box-shadow: 0 10px 0 var(--pick); border-color: var(--pick); }
  .card:focus-visible { outline: 4px solid var(--pick); outline-offset: 4px; }
  .help { color: var(--muted); margin-top: 32px; font-size: 15px; }
  .empty { margin-top: 32px; font-size: 18px; line-height: 1.5; color: var(--muted); max-width: 40rem; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<main>
  <h1 id="siteTitle">Our Family Games</h1>
  <p class="sub">Pick a game to play.</p>
  <div class="grid" id="grid"></div>
  <p class="help">Click or tap a game. With a keyboard or controller, use the arrows to choose and Enter or A to play.
    In a game, press Escape (or hold Select + Start) to come back here.</p>
</main>

<script>
(async () => {
  const grid = document.getElementById('grid');
  let cards = [], index = 0;

  let data;
  try {
    const res = await fetch('games.json', { cache: 'no-cache' });
    data = await res.json();
  } catch (e) {
    grid.outerHTML = '<p class="empty">The game list (games.json) couldn\'t be loaded. If you opened this file ' +
      'straight from your computer, that\'s why: browsers only load it from a website. Once the site is on ' +
      'Cloudflare it works.</p>';
    return;
  }

  if (data.siteTitle) {
    document.getElementById('siteTitle').textContent = data.siteTitle;
    document.title = data.siteTitle;
  }

  for (const g of data.games || []) {
    if (!g.title || !g.folder) continue;
    const a = document.createElement('a');
    a.className = 'card';
    a.href = g.folder + '/';
    a.innerHTML = '<div class="art"></div><div class="text"><h2></h2><p></p></div>';
    if (g.image) a.querySelector('.art').style.backgroundImage = `url("${g.image}")`;
    a.querySelector('h2').textContent = g.title;
    a.querySelector('p').textContent = g.tagline || '';
    grid.appendChild(a);
  }
  cards = [...grid.children];
  if (!cards.length) return;

  // Remember the last game picked, so coming back lands on it.
  try { index = Math.min(cards.length - 1, Number(localStorage.getItem('menu:last')) || 0); } catch (e) {}

  function select(i) {
    index = (i + cards.length) % cards.length;
    cards.forEach((c, k) => c.classList.toggle('sel', k === index));
    cards[index].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    try { localStorage.setItem('menu:last', index); } catch (e) {}
  }
  function columns() {
    const top = cards[0].offsetTop;
    return Math.max(1, cards.filter((c) => c.offsetTop === top).length);
  }
  const play = () => { location.href = cards[index].href; };
  cards.forEach((c, i) => c.addEventListener('mouseenter', () => select(i)));
  select(index);

  addEventListener('keydown', (e) => {
    const moves = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -columns(), ArrowDown: columns() };
    if (e.key in moves) { select(index + moves[e.key]); e.preventDefault(); }
    else if (e.key === 'Enter' || e.key === ' ') { play(); e.preventDefault(); }
  });

  // Controllers: d-pad or left stick to choose, A to play.
  const held = {};
  function press(name, on, fn) { if (on && !held[name]) fn(); held[name] = on; }
  (function poll() {
    for (const p of navigator.getGamepads ? navigator.getGamepads() : []) {
      if (!p) continue;
      press('l', p.buttons[14]?.pressed || p.axes[0] < -0.6, () => select(index - 1));
      press('r', p.buttons[15]?.pressed || p.axes[0] > 0.6, () => select(index + 1));
      press('u', p.buttons[12]?.pressed || p.axes[1] < -0.6, () => select(index - columns()));
      press('d', p.buttons[13]?.pressed || p.axes[1] > 0.6, () => select(index + columns()));
      press('a', p.buttons[0]?.pressed, play);
      break;
    }
    requestAnimationFrame(poll);
  })();
})();
</script>
</body>
</html>
